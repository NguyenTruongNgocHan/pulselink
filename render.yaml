services:
  - type: web
    name: pulselink-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: pulselink-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: pulselink-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pulselink-db
          property: password
      - key: REDIS_URL
        fromService:
          name: pulselink-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        value: https://pulselink.vercel.app

  - type: keyvalue
    name: pulselink-redis
    plan: free
    ipAllowList: []

databases:
  - name: pulselink-db
    plan: free
    databaseName: pulselink
    user: pulselink
