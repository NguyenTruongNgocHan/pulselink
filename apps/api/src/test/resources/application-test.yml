spring:
  datasource:
    url: jdbc:h2:mem:pulselink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

app:
  storage:
    cleanup:
      enabled: false
      delay-ms: 3600000

logging:
  level:
    root: WARN
    com.pulselink: INFO
    org.springframework.security: WARN