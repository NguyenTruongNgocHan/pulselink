spring:
  application:
    name: pulselink-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulselink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # In production this MUST be overridden via the JWT_SECRET env var —
    # never commit a real secret. Generate one with:
    #   openssl rand -base64 48
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-32bytes-min}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  storage:
    path: ${STORAGE_PATH:/data/uploads}
